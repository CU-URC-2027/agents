[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "cu-urc-research-agent"
version = "0.1.0"
description = "Local MCP tools for the CU-URC research synthesis plugin"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = ["mcp==2.2.0"]

[project.scripts]
research-agent-mcp = "mcp_server.server:main"

[tool.setuptools.packages.find]
include = ["mcp_server*"]

[tool.uv]
package = true
